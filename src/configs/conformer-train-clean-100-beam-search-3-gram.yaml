defaults:
  - model: conformer
  - writer: cometml
  - metrics: no_beam_search
  - datasets: train_clean_test_clean
  - dataloader: example
  - vocab: basic
  - transforms: mel
  - _self_
optimizer:
  _target_: torch.optim.AdamW
  lr: 3e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 1e-2
  pct_start: 0.1
  steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}
  anneal_strategy: cos
use_profiler: False
profile_cfg: # not used if use_profiler=False
  save_trace_in_file: ${writer.run_name}_trace.json
  save_table_in_file: ${writer.run_name}_table.txt
loss_function:
  _target_: src.loss.CTCLossWrapper
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
  vocab: ${vocab}
decoders:
  raw_decoder:
    name: raw-decoder
    vocab: ${vocab}
    _target_: src.text_encoder.CTCRawDecoder

  argmax_decoder:
    name: argmax-decoder
    vocab: ${vocab}
    _target_: src.text_encoder.CTCArgmaxDecoder

  beam_search_decoder:
    name: beam-search-decoder
    vocab: ${vocab}
    _target_: src.text_encoder.CTCBeamSearchDecoder
    lexicon: /home/enakin/.cache/torch/hub/torchaudio/decoder-assets/librispeech-3-gram/lexicon.txt # TODO: place in a script
    lm: /home/enakin/.cache/torch/hub/torchaudio/decoder-assets/librispeech-3-gram/lm.bin
    lm_weight: 3
    nbest: 1
trainer:
  log_step: 50
  n_epochs: 10000
  epoch_len: 2000
  device_tensors: ["spectrogram", "text_encoded"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: False # if True, will override the previous run with the same name
  monitor: "min val_WER_(Argmax)" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1
